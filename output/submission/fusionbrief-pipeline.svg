<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350" role="img" aria-labelledby="title desc"><title id="title">FUSIONBRIEF 파이프라인 아키텍처</title><desc id="desc">자연어 질의와 플래너에서 시작해 기준 선행 조사, 다국어 수집, 인용 검증, 기준별 사건 대조, 위험도와 액션, 인텔 보고서, 분석가 검토로 이어집니다. 기준 지식 저장소와 근거 온톨로지가 판단의 근거를 보존하며, 검토 변경 시 재검증합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#466f89" stroke-width="1.4"/></marker><marker id="feedback" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#ae8543" stroke-width="1.4"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}</style><rect width="1800" height="1350" fill="#f3f6f7"/><text x="60" y="53" font-size="24" fill="#294a60" font-weight="800">FUSIONBRIEF</text><text x="1740" text-anchor="end" y="53" font-size="16" fill="#6d8595" font-weight="600">PIPELINE ARCHITECTURE</text><text x="60" y="106" font-size="40" fill="#243e51" font-weight="750">자연어 질문을 검증 가능한 인텔리전스로</text><text x="60" y="143" font-size="21" fill="#657d8c" font-weight="400">판단 기준부터 조사하고, 출처마다 검증하며, 사람이 최종 판단합니다.</text><g><rect x="60" y="180" width="540" height="250" rx="18" fill="white" stroke="#d7e0e5" stroke-width="2"/><rect x="84" y="203" width="42" height="34" rx="8" fill="#e9eff2"/><text x="94" y="227" font-size="18" fill="#294a60" font-weight="700">01</text><text x="140" y="229" font-size="28" fill="#243e51" font-weight="700">질의 해석 · 플래너</text><text x="86" y="270" font-size="17" fill="#798b96" font-weight="500">QUESTION → RESEARCH PLAN</text><text x="86" y="312" font-size="21" fill="#496271" font-weight="400">질문의 명제 · 지역 · 기간 · 목적을 해석</text><text x="86" y="344" font-size="21" fill="#496271" font-weight="400">판단 기준 · 반증 · 경쟁 설명을 설계</text><text x="86" y="376" font-size="21" fill="#496271" font-weight="400">언어 · 자료 유형 · 검색어 · 종료 조건 설정</text></g><g><rect x="630" y="180" width="540" height="250" rx="18" fill="white" stroke="#d7e0e5" stroke-width="2"/><rect x="654" y="203" width="42" height="34" rx="8" fill="#e9eff2"/><text x="664" y="227" font-size="18" fill="#294a60" font-weight="700">02</text><text x="710" y="229" font-size="28" fill="#243e51" font-weight="700">판단 기준 선행 조사</text><text x="656" y="270" font-size="17" fill="#798b96" font-weight="500">CRITERIA FIRST</text><text x="656" y="312" font-size="21" fill="#496271" font-weight="400">필요한 교범 · 법규 · 정책 · 연구 검색</text><text x="656" y="344" font-size="21" fill="#496271" font-weight="400">기준의 원문 · 정의 · 판본 · 적용 범위 검증</text><text x="656" y="376" font-size="21" fill="#496271" font-weight="400">보존된 기준 지식을 찾아 재사용</text></g><g><rect x="1200" y="180" width="540" height="250" rx="18" fill="white" stroke="#d7e0e5" stroke-width="2"/><rect x="1224" y="203" width="42" height="34" rx="8" fill="#e9eff2"/><text x="1234" y="227" font-size="18" fill="#294a60" font-weight="700">03</text><text x="1280" y="229" font-size="28" fill="#243e51" font-weight="700">다국어 · 다중출처 수집</text><text x="1226" y="268" font-size="17" fill="#798b96" font-weight="500">언어별 검색 + 공개 문서 · 관측자료 수집</text><rect x="1226" y="287" width="155" height="23" rx="6" fill="#edf3f6"/><text x="1236" y="304" font-size="14" fill="#49697d" font-weight="500">뉴스</text><rect x="1391" y="287" width="155" height="23" rx="6" fill="#edf3f6"/><text x="1401" y="304" font-size="14" fill="#49697d" font-weight="500">정부 발표</text><rect x="1556" y="287" width="155" height="23" rx="6" fill="#edf3f6"/><text x="1566" y="304" font-size="14" fill="#49697d" font-weight="500">북한 발신 매체</text><rect x="1226" y="315" width="155" height="23" rx="6" fill="#edf3f6"/><text x="1236" y="332" font-size="14" fill="#49697d" font-weight="500">SNS</text><rect x="1391" y="315" width="155" height="23" rx="6" fill="#edf3f6"/><text x="1401" y="332" font-size="14" fill="#49697d" font-weight="500">공개 논의</text><rect x="1556" y="315" width="155" height="23" rx="6" fill="#edf3f6"/><text x="1566" y="332" font-size="14" fill="#49697d" font-weight="500">사진 · 영상</text><rect x="1226" y="343" width="155" height="23" rx="6" fill="#edf3f6"/><text x="1236" y="360" font-size="14" fill="#49697d" font-weight="500">위성 관측</text><rect x="1391" y="343" width="155" height="23" rx="6" fill="#edf3f6"/><text x="1401" y="360" font-size="14" fill="#49697d" font-weight="500">항적 관련 자료</text><rect x="1556" y="343" width="155" height="23" rx="6" fill="#edf3f6"/><text x="1566" y="360" font-size="14" fill="#49697d" font-weight="500">선박 관련 자료</text><rect x="1226" y="371" width="155" height="23" rx="6" fill="#edf3f6"/><text x="1236" y="388" font-size="14" fill="#49697d" font-weight="500">논문</text><rect x="1391" y="371" width="155" height="23" rx="6" fill="#edf3f6"/><text x="1401" y="388" font-size="14" fill="#49697d" font-weight="500">특허</text><text x="1226" y="416" font-size="17" fill="#687f8f" font-weight="400">실제 검색어 · URL · 확보 / 실패 상태를 기록</text></g><g><rect x="1200" y="500" width="540" height="250" rx="18" fill="white" stroke="#d7e0e5" stroke-width="2"/><rect x="1224" y="523" width="42" height="34" rx="8" fill="#e9eff2"/><text x="1234" y="547" font-size="18" fill="#294a60" font-weight="700">04</text><text x="1280" y="549" font-size="28" fill="#243e51" font-weight="700">인용 · 내용 검증</text><text x="1226" y="590" font-size="17" fill="#798b96" font-weight="500">SOURCE-TO-CLAIM VALIDATION</text><text x="1226" y="632" font-size="21" fill="#496271" font-weight="400">원문 해시 · 정확한 인용 위치를 대조</text><text x="1226" y="664" font-size="21" fill="#496271" font-weight="400">주장 의미 · 번역 · 날짜 · 자료 역할 확인</text><text x="1226" y="696" font-size="21" fill="#496271" font-weight="400">원발표 재인용을 독립 확인으로 세지 않음</text><text x="1226" y="728" font-size="21" fill="#496271" font-weight="400">검증을 통과하지 못한 근거는 제외</text></g><g><rect x="630" y="500" width="540" height="250" rx="18" fill="white" stroke="#d7e0e5" stroke-width="2"/><rect x="654" y="523" width="42" height="34" rx="8" fill="#e9eff2"/><text x="664" y="547" font-size="18" fill="#294a60" font-weight="700">05</text><text x="710" y="549" font-size="28" fill="#243e51" font-weight="700">기준별 사건 대조</text><text x="656" y="590" font-size="17" fill="#798b96" font-weight="500">CROSS-CHECK + EVIDENCE ONTOLOGY</text><text x="656" y="632" font-size="21" fill="#496271" font-weight="400">충족 · 부분 확인 · 미확인 · 반대 근거 구분</text><text x="656" y="664" font-size="21" fill="#496271" font-weight="400">기준 → 사건 → 주장 → 인용 → 원출처 연결</text><text x="656" y="696" font-size="21" fill="#496271" font-weight="400">관계와 근거의 무결성을 검사</text><text x="656" y="728" font-size="21" fill="#496271" font-weight="400">핵심 전제의 공백은 판단 유보로 반영</text></g><g><rect x="60" y="500" width="540" height="250" rx="18" fill="white" stroke="#d7e0e5" stroke-width="2"/><rect x="84" y="523" width="42" height="34" rx="8" fill="#e9eff2"/><text x="94" y="547" font-size="18" fill="#294a60" font-weight="700">06</text><text x="140" y="549" font-size="28" fill="#243e51" font-weight="700">위험도 · 권장 액션</text><text x="86" y="590" font-size="17" fill="#798b96" font-weight="500">RISK &amp; NEXT ACTIONS</text><text x="86" y="632" font-size="21" fill="#496271" font-weight="400">가능성 × 영향의 정성적 위험도 행렬</text><text x="86" y="664" font-size="21" fill="#496271" font-weight="400">근거 신뢰도를 위험 수준과 별도로 표시</text><text x="86" y="696" font-size="21" fill="#496271" font-weight="400">우선순위 · 기한 · 재평가 신호 · 완료 조건</text><text x="86" y="728" font-size="21" fill="#496271" font-weight="400">위험 판단과 추가 액션을 별도 검증</text></g><g><rect x="60" y="820" width="540" height="220" rx="18" fill="white" stroke="#d7e0e5" stroke-width="2"/><rect x="84" y="843" width="42" height="34" rx="8" fill="#e9eff2"/><text x="94" y="867" font-size="18" fill="#294a60" font-weight="700">07</text><text x="140" y="869" font-size="28" fill="#243e51" font-weight="700">인텔 보고서 · 시각화</text><text x="86" y="910" font-size="17" fill="#798b96" font-weight="500">BRIEFING &amp; VISUALS</text><text x="86" y="952" font-size="21" fill="#496271" font-weight="400">핵심 판단 → 근거 → 전망 → 추가 액션</text><text x="86" y="984" font-size="21" fill="#496271" font-weight="400">주장별 주석 · 출처 · 신뢰도 표시</text><text x="86" y="1016" font-size="21" fill="#496271" font-weight="400">위험도 색상 · 사건 순서 · 문장별 근거 그래프</text></g><g><rect x="630" y="820" width="540" height="220" rx="18" fill="white" stroke="#d7e0e5" stroke-width="2"/><rect x="654" y="843" width="42" height="34" rx="8" fill="#e9eff2"/><text x="664" y="867" font-size="18" fill="#294a60" font-weight="700">08</text><text x="710" y="869" font-size="28" fill="#243e51" font-weight="700">분석가 검토 · 승인</text><text x="656" y="910" font-size="17" fill="#798b96" font-weight="500">HUMAN IN THE LOOP</text><text x="656" y="952" font-size="21" fill="#496271" font-weight="400">원출처 · 독립성 · 판단을 검토</text><text x="656" y="984" font-size="21" fill="#496271" font-weight="400">승인 / 보완 요청 · 변경 이력 보존</text><text x="656" y="1016" font-size="21" fill="#496271" font-weight="400">근거 변경 시 관련 판단 재검증 · 승인 해제</text></g><g><rect x="1200" y="820" width="540" height="220" rx="18" fill="#243f52"/><text x="1226" y="868" font-size="28" fill="#ffffff" font-weight="700">추적 가능한 결과물</text><text x="1226" y="906" font-size="21" fill="#e5edf2" font-weight="400">인텔 보고서 · 위험도 · 권장 추가 액션</text><text x="1226" y="942" font-size="21" fill="#e5edf2" font-weight="400">판단에서 원문까지 연결되는 근거 경로</text><text x="1226" y="981" font-size="21" fill="#c5d7e2" font-weight="400">A4 / PDF · Markdown · JSON-LD</text></g><path d="M600 305 H630" fill="none" stroke="#466f89" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1170 305 H1200" fill="none" stroke="#466f89" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1470 430 V500" fill="none" stroke="#466f89" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1200 625 H1170" fill="none" stroke="#466f89" stroke-width="3"  marker-end="url(#arrow)"/><path d="M630 625 H600" fill="none" stroke="#466f89" stroke-width="3"  marker-end="url(#arrow)"/><path d="M330 750 V820" fill="none" stroke="#466f89" stroke-width="3"  marker-end="url(#arrow)"/><path d="M600 930 H630" fill="none" stroke="#466f89" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1170 930 H1200" fill="none" stroke="#466f89" stroke-width="3"  marker-end="url(#arrow)"/><path d="M900 820 V785 H1770 V625 H1740" fill="none" stroke="#ae8543" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#feedback)"/><text x="1170" y="778" font-size="16" fill="#9b783e" font-weight="600">검토 변경 → 관련 판단·위험도 재검증</text><rect x="60" y="1090" width="820" height="165" rx="16" fill="#e6edf1"/><text x="86" y="1134" font-size="25" fill="#294a60" font-weight="700">기준 지식 저장소</text><text x="86" y="1171" font-size="21" fill="#496271" font-weight="400">SQLite FTS5 · 판본별 불변 스냅샷 · 원문 해시</text><text x="86" y="1206" font-size="19" fill="#617b8c" font-weight="400">자료별 재확인 주기 · 인용한 판본 보존 · 02단계에서 재사용</text><rect x="920" y="1090" width="820" height="165" rx="16" fill="#e6edf1"/><text x="946" y="1134" font-size="25" fill="#294a60" font-weight="700">근거 온톨로지</text><text x="946" y="1171" font-size="21" fill="#496271" font-weight="400">기준 · 사건 · 주장 · 인용 · 원출처 · 판단 · 위험도 · 액션</text><text x="946" y="1206" font-size="19" fill="#617b8c" font-weight="400">타입 관계 · 참조 무결성 검증 · JSON-LD 내보내기</text><text x="60" y="1294" font-size="18" fill="#607889" font-weight="400">다국어 검색 지원: 한국·중국·일본·러시아·영문권 + 북한 발신 매체 목록. 실제 확보 여부는 실행별로 구분합니다.</text><text x="60" y="1325" font-size="18" fill="#607889" font-weight="400">실시간 ADS-B·AIS 전용 피드 미연동. 명시된 모의 자료는 실제 출처·인용·위험도·신뢰도 계산에서 제외합니다.</text></svg>